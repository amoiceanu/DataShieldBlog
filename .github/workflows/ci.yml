name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  composer-audit:
    name: Composer security audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer
      # Behat depends on behat/transliterator, which is abandoned but has no
      # replacement. Keep reporting it without treating abandonment as a CVE.
      - name: Audit Composer dependencies
        run: composer audit --locked --abandoned=report

  npm-audit:
    name: npm security audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked npm dependencies
        run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  asset-build:
    name: Compile frontend assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked npm dependencies
        run: npm ci
      - name: Compile production assets
        run: npm run build
      - name: Save production assets for deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-assets
          path: public/build/
          if-no-files-found: error
          retention-days: 1

  phpunit:
    name: Run PHPUnit
    runs-on: ubuntu-latest
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      XDEBUG_MODE: coverage
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up PHP with coverage support
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: xdebug
          extensions: mbstring, sqlite3, pdo_sqlite, xml, curl, dom, fileinfo
          tools: composer
      - name: Install locked Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run PHPUnit and generate Clover coverage
        run: vendor/bin/phpunit --coverage-clover=coverage.xml
      - name: Save coverage report for the coverage gate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phpunit-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  coverage-floor:
    name: Enforce 70% coverage floor
    needs: [phpunit]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: xml
      - name: Download PHPUnit coverage report
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8
        with:
          name: phpunit-coverage
      - name: Enforce minimum statement coverage
        run: php scripts/check-coverage.php coverage.xml 70

  gherkin:
    name: Run executable Gherkin scenarios
    runs-on: ubuntu-latest
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, xml, curl, dom, fileinfo
          tools: composer
      - name: Install locked Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run Gherkin scenarios with Behat
        run: composer test:gherkin

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [composer-audit, npm-audit, asset-build, phpunit, coverage-floor, gherkin]
    runs-on: ubuntu-latest
    concurrency:
      group: securitate-digitala-production
      cancel-in-progress: false
    env:
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*\$?$ ]] || { echo 'DEPLOY_USER must be a Unix account name.' >&2; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]] || { echo 'DEPLOY_PATH must be an absolute path without spaces.' >&2; exit 1; }
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8
        with:
          name: production-assets
          path: deployment-assets
      - name: Package verified frontend assets
        run: tar -czf public-build.tar.gz -C deployment-assets .
      - name: Copy frontend assets to the droplet
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            public-build.tar.gz \
            "$DEPLOY_USER@165.22.88.77:/tmp/securitate-digitala-build-${GITHUB_SHA}.tar.gz"
      - name: Deploy latest main on the DigitalOcean droplet
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@165.22.88.77" \
            "DEPLOY_PATH='$DEPLOY_PATH' ASSET_ARCHIVE='/tmp/securitate-digitala-build-${GITHUB_SHA}.tar.gz' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch origin main
          git switch main
          git merge --ff-only origin/main
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          mkdir -p public/build
          tar -xzf "$ASSET_ARCHIVE" -C public/build
          rm "$ASSET_ARCHIVE"
          php artisan migrate --force
          php artisan db:seed --class=ContentCatalogSeeder --force
          php artisan optimize
          REMOTE
