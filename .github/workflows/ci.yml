name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer-audit:
    name: Composer security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      # Behat depends on behat/transliterator, which is abandoned but has no
      # replacement. Keep reporting it without treating abandonment as a CVE.
      - run: composer audit --locked --abandoned=report

  npm-audit:
    name: npm security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  asset-build:
    name: Compile frontend assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  php-tests:
    name: PHPUnit, coverage, and Gherkin
    runs-on: ubuntu-latest
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      XDEBUG_MODE: coverage
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: xdebug
          extensions: mbstring, sqlite3, pdo_sqlite, xml, curl, dom, fileinfo
          tools: composer
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpunit --coverage-clover=coverage.xml
      - run: php scripts/check-coverage.php coverage.xml 70
      - run: composer test:gherkin
